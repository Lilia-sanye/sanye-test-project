# 草稿：screen_ui_task_cases.py 生成 — 须审阅后移至 midscene自动化输出/scripts/
# 精修: .trae/skills/Midscene/Midscene安卓自动化脚本/SKILL.md
config:
  ai:
    actionTimeout: 30000
    retryInterval: 200
  page:
    defaultWait: 200

android:
  deviceId: "<设备ID>"
  androidAdbPath: "D:/soft/android-sdk/platform-tools/adb.exe"

agent:
  testId: "界面和任务设置-P0-A档冒烟"
  groupName: "界面和任务设置"
  generateReport: true
  aiActContext: "权限弹窗点击允许；更新提示跳过；确认框点确认"

tasks:
  - name: "12903581-机器状态切换，状态图标同步显示"
    repeat: 1
    flow:
      - ai: 从作业中手动暂停，再恢复作业
      - ai: 异常状态解除后（如定位、点击过载等故障修复）
      - aiAssert: 1.状态从黄色（暂停）→ 绿色（作业中），切换流畅

  - name: "12903741-地图栏进入地图切换页面可切换地图，地图切换成功后地图栏显示切换后地图名称"
    repeat: 1
    flow:
      - ai: 地图栏点击弹窗地图切换，选中地图切换，查看切换效果及名称显示
      - aiAssert: 1、1.单地图切换成功，地图栏显示切换后地图名称

  - name: "12904003-定位成功已建图，地图栏展示当前定位地图名称"
    repeat: 1
    flow:
      - ai: 确保机器人已完成至少一张地图建图；
      - ai: 启动机器人，使其定位成功；
      - ai: 进入地图页面，查看地图栏。
      - aiAssert: 地图栏显示当前地图名称（如地图A），名称过长时自动滑动显示，无截断

  - name: "12904005-定位失败（rtk卫星定位丢失），地图栏显示有提示"
    repeat: 1
    flow:
      - ai: 启动机器人，使其定位成功；
      - ai: 模拟定位失败场景（如关闭 RTK/GPS /激光模块）；
      - ai: 进入地图页面，查看地图栏。
      - aiAssert: 1.首次进入，地图栏显示’定位丢失-切换地图‘，点击切换地图弹窗地图切换页面，任务列表为空提示定位丢失

  - name: "12903558-无地图引导内容显示与创建地图按钮响应"
    repeat: 1
    flow:
      - ai: 查看右侧引导面板的文案、示意图；
      - ai: 点击左侧地图任意区域
      - aiAssert: 1、1. 正确显示主标题「请先创建地图」、副标题「即可快速开始作业」，引导示意图完整无变形、无文案错误；

  - name: "12903565-手动切换地图后，首页作业任务列表同步刷新"
    repeat: 1
    flow:
      - ai: 当前地图添加保存多个任务或执行过任务
      - ai: 进入地图管理页面切换其他地图|
      - ai: 查看任务列表显示
      - aiAssert: 1、任务列表同步刷新，显示当前地图所关联的任务，无任务保存与执行显示为空

  - name: "12903567-关联地图创建任务集，任务地图有变化，相关任务集自动删除"
    repeat: 1
    flow:
      - ai: 首页作业任务列表显示任务集1.
      - ai: 进入建图工具，删除地图b
      - ai: 返回首页查看页面及作业任务列表显示
      - ai: 首页作业任务列表显示任务集1.
      - ai: 进入建图工具，删除地图b，再次新建一个地图b同样联通ac区域
      - ai: 返回首页查看页面及作业任务列表显示
      - aiAssert: 1、1.首页有地图发生变化任务及任务集有变动的相关提示

  - name: "12903569-任务列表排序规则验证"
    repeat: 1
    flow:
      - ai: 查看现有任务排序
      - ai: 无默认任务时新建任务
      - ai: 有默认任务时新建任务
      - ai: 查看列表及默认选择态
      - aiAssert: 1、1. 默认任务固定置顶

  - name: "12903874-首页作业任务列表，任务可展开查看详情"
    repeat: 1
    flow:
      - ai: 点击任务列表项
      - aiAssert: 1. 展开任务详情

  - name: "12903875-首页作业任务列表，任务卡片可选中、收起、切换交互"
    repeat: 1
    flow:
      - ai: 点击未选中任务卡片
      - ai: 点击已选中任务卡片
      - ai: 依次切换不同任务卡片
      - aiAssert: 1、1. 卡片展开，任务选中，地图区域高亮

  - name: "12903883-任务列表选中任务可直接开始任务"
    repeat: 1
    flow:
      - ai: 任务列表选中任务，点击开始作业查看
      - aiAssert: 1、直接开始选中任务执行

  - name: "12903794-编辑任务，区域添加列表，点击作业区名称添加任务"
    repeat: 1
    flow:
      - ai: 点击「B区-东侧花园」左侧「+」按钮
      - aiAssert: 「B区-东侧花园」被添加至任务列表；可添加区域中该区域显示「已添加1次」

  - name: "12903795-编辑任务，点击地图上作业区底图添加任务"
    repeat: 1
    flow:
      - ai: 新建任务
      - ai: 点击底图区域查看
      - aiAssert: 1.点击底图区域自动添加当前工作区域任务到任务列表，地图上选中区域高亮显示区域内元素

  - name: "12903835-任务列表编辑任务，进入编辑任务页面"
    repeat: 1
    flow:
      - ai: 任务列表展开详情显示，点击编辑任务组合，查看
      - aiAssert: 1、进入编辑任务页面

  - name: "12903841-有任务/有任务编辑可正常保存"
    repeat: 1
    flow:
      - ai: 点击「保存」按钮
      - aiAssert: 1.页面返回上一级，当前任务组合配置成功保存

