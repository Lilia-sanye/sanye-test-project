config:
  ai:
    actionTimeout: 30000
    retryInterval: 200
  page:
    defaultWait: 200

android:
  deviceId: "<设备ID>"
  androidAdbPath: "D:/soft/android-sdk/platform-tools/adb.exe"

agent:
  testId: "界面设置与操作测试"
  groupName: "界面测试套件"
  generateReport: true
  aiActContext: "权限弹窗点击允许，更新提示点击跳过"

tasks:
  - name: "联网状态状态栏时间显示正确--格式为「HH:MM」"
    repeat: 1
    flow:
      - ai: "机器人正常联网，查看状态栏时间"
      - aiAssert: "验证操作完成"

  - name: "断网状态状态栏同步本地时间"
    repeat: 1
    flow:
      - ai: "机器人断网，查看状态栏时间"
      - aiAssert: "验证操作完成"

  - name: "修改系统时间，状态栏正常同步"
    repeat: 1
    flow:
      - ai: "1.进入系统设置2.修改时区"
      - ai: "修改系统时间后，查看状态栏时间"
      - aiAssert: "验证操作完成"

  - name: "Android图形界面修改系统时间，同步Linux从板"
    repeat: 1
    flow:
      - ai: "1. 保持双板正常连接，同步服务处于运行状态2. 操作Android主板：设置 → 日期和时间 → 关闭“自动确定日期和时间”3. 手动修改Android时间为指定值（如2026-04-10 14:30:00），点击确认4. 等待5秒5. 登录Linux从板，终端执行命令“date”查看系统时间6. 记录双板时间偏差，重复测试3次"
      - aiAssert: "验证操作完成"

  - name: "Android ADB命令修改系统时间，同步Linux从板"
    repeat: 1
    flow:
      - ai: "1. 保持双板正常连接，同步服务处于运行状态2. 电脑通过ADB连接Android主板，执行命令：adb shell date -s "2026-04-10 16:45:30"（格式：YYYY-MM-DD HH:MM:SS）3. 等待5秒4. 登录Linux从板，终端执行命令“date”查看系统时间5. 记录双板时间偏差，重复测试3次"
      - aiAssert: "验证操作完成"

  - name: "Android修改时区，同步Linux从板（非跨日期）"
    repeat: 1
    flow:
      - ai: "1. 保持双板正常连接，同步服务处于运行状态2. 操作Android主板：设置 → 日期和时间 → 关闭“自动确定时区”3. 手动选择时区为“东京（UTC+9）”，点击确认4. 等待5秒5. 登录Linux从板，终端执行命令“timedatectl”查看时区和本地时间，执行“cat /etc/timezone”查看时区配置6. 对比双板时区和时间，重复测试2次（更换其他非跨日期时区，如伦敦UTC+0）"
      - aiAssert: "验证操作完成"

  - name: "Android修改时区，同步Linux从板（跨国际日期变更线）"
    repeat: 1
    flow:
      - ai: "1. 保持双板正常连接，同步服务处于运行状态2. 操作Android主板：设置 → 日期和时间 → 选择时区为“纽约（UTC-5）”3. 等待5秒4. 查看Android主板本地时间（应变为2026-04-09 21:00:00）5. 登录Linux从板，执行“timedatectl”和“date”命令，查看时区"
      - aiAssert: "验证操作完成"

  - name: "Android主板重启后，主动同步时间/时区到Linux从板 "
    repeat: 1
    flow:
      - ai: "1. 操作Android主板，重启设备2. 等待Android主板完全开机，同步服务自动启动（约1-3分钟）3. 开机后，修改Android时间为17:00:00.时区为UTC+94. 等待5秒5. 登录Linux从板，执行“date”和“timedatectl”命令查看时间和时区6. 对比双板一致性"
      - aiAssert: "验证操作完成"

  - name: "Linux从板重启后，同步Android主板最新时间/时区"
    repeat: 1
    flow:
      - ai: "1. 保持Android主板正常运行，同步服务开启2. 登录Linux从板，执行命令“reboot”重启从板3. 等待Linux从板完全开机（约1-5分钟）4. 开机后，执行“date”和“timedatectl”命令查看时间和时区5. 对比与Android主板的一致性"
      - aiAssert: "验证操作完成"

  - name: "双板时间同步（linux从板同步主板安卓时区/时间）"
    repeat: 1
    flow:
      - ai: "1.修改Android系统时区后检查是否自动调整，例如：将时区改为美国时区America/New_York：sudo timedatectl set-timezone America/New_Yorktimedatectl status2.重启系统后检查时区是否和重启前一致sudo reboottimedatectl status"
      - aiAssert: "验证操作完成"

  - name: "信号状态改变，状态栏4G图标显示正确"
    repeat: 1
    flow:
      - ai: "1.查看主界面4G状态栏显示"
      - aiAssert: "验证操作完成"

  - name: "信号状态改变，状态栏WiFi图标显示正确"
    repeat: 1
    flow:
      - ai: "1.关闭 WiFi，仅保留 4G2.WiFi信号弱"
      - aiAssert: "验证操作完成"

  - name: "电量 ≤ 20%，电量图标和百分比文字变为红色"
    repeat: 1
    flow:
      - ai: "1.控制机器运动耗电2.电量 ≤ 20%（如 18%），查看状态栏电量显示"
      - aiAssert: "验证操作完成"

  - name: "电量从 21% 降至 20%/19% 瞬间，图标和文字立即从正常色切换为红色，无"
    repeat: 1
    flow:
      - ai: "1.手动控制机器运动耗电2.查看电量从 21% 降至20%"
      - aiAssert: "验证操作完成"

  - name: "充电至100%（电量100%显示常驻提示充电完成）"
    repeat: 1
    flow:
      - ai: "将机器充电至100%查看设备页面状态"
      - aiAssert: "验证操作完成"

  - name: "充电中不可切换退出充电动画页面"
    repeat: 1
    flow:
      - ai: "1.查看充电动画页面显示2.点击页面尝试退出"
      - aiAssert: "验证操作完成"

  - name: "退出充电状态，屏幕充电动画自动关闭"
    repeat: 1
    flow:
      - ai: "1.查看充电主机页面展示2.手动断开充电器，退出充电状态查看主界面显示"
      - aiAssert: "验证操作完成"

  - name: "状态图标-黄色，暂停"
    repeat: 1
    flow:
      - ai: "作业中手动暂停任务（如屏幕点击暂停）"
      - aiAssert: "验证操作完成"

  - name: "故障解除，状态图标同步切换"
    repeat: 1
    flow:
      - ai: "点击过载等故障修复）"
      - aiAssert: "验证操作完成"

  - name: "地图栏默认展示定位图标、地图名称"
    repeat: 1
    flow:
      - ai: "1.当前定位地图创建地图或多个关联区域地图，查看地图栏"
      - aiAssert: "验证操作完成"

  - name: "地图栏点击弹窗地图切换列表"
    repeat: 1
    flow:
      - ai: "1.进入首页，查看地图栏，点击地图栏"
      - aiAssert: "验证操作完成"

  - name: "地图切换列表以地图组形式展示"
    repeat: 1
    flow:
      - ai: "1.点击地图栏，查看地图切换列表"
      - aiAssert: "验证操作完成"

  - name: "地图名称过长，地图栏滑动显示名称（跑马灯）"
    repeat: 1
    flow:
      - ai: "1.查看地图栏名称显示"
      - aiAssert: "验证操作完成"

  - name: "地图名称长度适中，地图栏固定名称显示"
    repeat: 1
    flow:
      - ai: "1.查看地图栏名称显示"
      - aiAssert: "验证操作完成"

  - name: "地图名称同名，地图栏正常展示"
    repeat: 1
    flow:
      - ai: "1.创建两张地图名均为A的关联地图2.查看地图栏显示"
      - aiAssert: "验证操作完成"

  - name: "地图栏进入地图切换页面可切换地图，地图切换成功后地图栏显示切换后地图名称"
    repeat: 1
    flow:
      - ai: "1.地图栏点击弹窗地图切换，选中地图切换，查看切换效果及名称显示"
      - aiAssert: "验证操作完成"

  - name: "作业任务执行中地图栏不展示"
    repeat: 1
    flow:
      - ai: "1.设置割草"
      - ai: "手动接管）3.查看任务执行中包括任务暂停状态及返航回充中"
      - aiAssert: "验证操作完成"

  - name: "定位成功已建图，地图栏展示当前定位地图名称"
    repeat: 1
    flow:
      - ai: "1. 确保机器人已完成至少一张地图建图2. 启动机器人，使其定位成功3. 进入地图页面，查看地图栏"
      - aiAssert: "验证操作完成"

  - name: "定位丢失（语义地图定位丢失），地图栏显示有提示"
    repeat: 1
    flow:
      - ai: "1.进入首页切换当前定位地图2.地图栏显示当前定位地图时，手动模拟丢定位（遮挡传感器）3.查看地图栏显示"
      - aiAssert: "验证操作完成"

  - name: "定位失败（rtk卫星定位丢失），地图栏显示有提示"
    repeat: 1
    flow:
      - ai: "1. 启动机器人，使其定位成功2. 模拟定位失败场景（如关闭 RTK/GPS /激光模块）3. 进入地图页面，查看地图栏"
      - aiAssert: "验证操作完成"

  - name: "手动切换非当前定位地图，地图栏显示切换地图名称"
    repeat: 1
    flow:
      - ai: "1.当前定位区域切换其他位置地图查看"
      - aiAssert: "验证操作完成"

  - name: "未建图有卫星地图时，地图栏不显示"
    repeat: 1
    flow:
      - ai: "1. 确保机器人未进行任何建图操作2. 机器人定位成功/失败，启动机器人3. 进入地图页面，查看地图栏"
      - aiAssert: "验证操作完成"

  - name: "机器抵达地图切换点，自动切换地图后，地图名称同步更新"
    repeat: 1
    flow:
      - ai: "1.设置好地图任务执行切换地图，2.查看地图搜索栏地图名称显示"
      - aiAssert: "验证操作完成"

  - name: "已建图被删除后，定位成功地图栏切换显示正常（当前使用地图名-不显示地图栏） "
    repeat: 1
    flow:
      - ai: "1.当前定位建图成功，查看地图栏显示2.删除地图，再次查看地图栏"
      - aiAssert: "验证操作完成"

  - name: "首页点击地图栏弹窗地图切换，点击地图管理按钮跳转至 “地图管理” 界面"
    repeat: 1
    flow:
      - ai: "1. 进入地图列表或相关页面2. 点击 “地图管理” 按钮3. 观察页面跳转"
      - aiAssert: "验证操作完成"

  - name: "地图管理页面左上角显示当前正在使用的地图名称"
    repeat: 1
    flow:
      - ai: "查看地图管理页面左上角显示"
      - aiAssert: "验证操作完成"

  - name: "无网络进入可地图管理页面（列表查看、选中地图、预览地图）"
    repeat: 1
    flow:
      - ai: "1.进入地图管理页面"
      - aiAssert: "验证操作完成"

  - name: "无地图数据时打开地图列表-页面显示为空有提示"
    repeat: 1
    flow:
      - ai: "1. 进入地图管理主界面2. 查看页面显示"
      - aiAssert: "验证操作完成"

  - name: "地图数量≥20 张超大数据量场景验证--列表滑动流畅"
    repeat: 1
    flow:
      - ai: "1. 打开地图列表2. 上下滑动"
      - aiAssert: "验证操作完成"

  - name: "地图名称相同可通过缩略图/创建时间区分"
    repeat: 1
    flow:
      - ai: "1.进入地图管理，查看列表地图显示"
      - aiAssert: "验证操作完成"

  - name: "快速连续点击不同地图卡片验证--不重复加载、正常跳转"
    repeat: 1
    flow:
      - ai: "1. 极快连续点击不同地图卡片"
      - aiAssert: "验证操作完成"

  - name: "按钮点击响应丝滑"
    repeat: 1
    flow:
      - ai: "1. 进入 “地图管理” 界面2. 多次点击界面中的操作按钮（如导入）3. 观察响应速度"
      - aiAssert: "验证操作完成"

  - name: "防暴力点击保护"
    repeat: 1
    flow:
      - ai: "1. 进入 “地图管理” 界面2. 快速连续点击同一按钮（如 10 次 / 秒）3. 观察页面行为"
      - aiAssert: "验证操作完成"

  - name: "无建图时地图列表为空"
    repeat: 1
    flow:
      - ai: "1. 进入地图管理页面2.观察地图列表区域"
      - aiAssert: "验证操作完成"

  - name: "地图列表点击图标滑出至左侧"
    repeat: 1
    flow:
      - ai: "1. 进入地图管理页面2. 点击地图列表图标3. 观察列表弹出位置"
      - aiAssert: "验证操作完成"

  - name: "地图列表以列表 + 缩略图形式展示"
    repeat: 1
    flow:
      - ai: "1. 打开地图列表2. 观察列表项展示形式"
      - aiAssert: "验证操作完成"

  - name: "默认显示最近使用的 3 张地图"
    repeat: 1
    flow:
      - ai: "1. 确保已使用过至少 3 张不同地图2. 打开地图列表3. 观察默认展示的地图"
      - aiAssert: "验证操作完成"

  - name: "地图项标注清晰名称和建图时间"
    repeat: 1
    flow:
      - ai: "1. 打开地图列表2. 查看每个地图项的文字信息"
      - aiAssert: "验证操作完成"

  - name: "超过 3 张地图可流畅滑动查看"
    repeat: 1
    flow:
      - ai: "1. 新建 4 张以上地图并使用2. 打开地图列表3. 上下滑动列表"
      - aiAssert: "验证操作完成"

  - name: "缩略图显示地图边界和核心禁区"
    repeat: 1
    flow:
      - ai: "1. 打开地图列表2. 查看地图缩略图"
      - aiAssert: "验证操作完成"

  - name: "点击地图项可选中对应地图"
    repeat: 1
    flow:
      - ai: "1. 打开地图列表2. 点击某一地图的名称或缩略图3. 观察选中状态"
      - aiAssert: "验证操作完成"

  - name: "无调整时默认选中最近一次使用的地图"
    repeat: 1
    flow:
      - ai: "1. 退出界面后重新进入2. 打开地图列表3. 查看默认选中项"
      - aiAssert: "验证操作完成"

  - name: "选中地图后可进行地图预览"
    repeat: 1
    flow:
      - ai: "地图管理页面选中地图查看"
      - aiAssert: "验证操作完成"

  - name: "预览地图自动加载该地图的路径规划、边界、禁区、点位，同步显示到机器人当前在地图中"
    repeat: 1
    flow:
      - ai: "选中地图列表地图预览查看"
      - aiAssert: "验证操作完成"

  - name: "预览地图机器人所在地图位置红色圆点显示"
    repeat: 1
    flow:
      - ai: "预览地图查看机器在地图中的显示"
      - aiAssert: "验证操作完成"

  - name: "点击 “+” 可新增和导入地图"
    repeat: 1
    flow:
      - ai: "1. 打开地图管理2. 点击页面中的 “+” 按钮3. 观察弹出选项"
      - aiAssert: "验证操作完成"

  - name: "‘新增’地图，进入创建地图页面"
    repeat: 1
    flow:
      - ai: "1.打开地图管理，点击页面中”+“按钮，选中‘新增’地图，查看"
      - aiAssert: "验证操作完成"

  - name: "导入地图可进行地图导入"
    repeat: 1
    flow:
      - ai: "1.打开地图管理，点击页面中”+“按钮，选中‘导入’地图，查看"
      - aiAssert: "验证操作完成"

  - name: "作业任务列表页面默认状态与展开收起功能验证（无任务）"
    repeat: 1
    flow:
      - ai: "1. 进入作业任务页面，查看右侧面板默认状态2. 点击面板标题 / 收起控件切换为收起状态3. 点击「暂无作业任务 >」按钮切换回展开状态"
      - aiAssert: "验证操作完成"

  - name: "作业任务列表默认展示与收起展开功能验证（有任务）"
    repeat: 1
    flow:
      - ai: "1. 进入首页面查看列表默认状态2. 点击收起 / 展开按钮切换状态"
      - aiAssert: "验证操作完成"

  - name: "无地图引导内容显示与创建地图按钮响应"
    repeat: 1
    flow:
      - ai: "1. 查看右侧引导面板的文案"
      - ai: "示意图2. 点击左侧地图任意区域"
      - aiAssert: "验证操作完成"

  - name: "作业任务列表无任务引导内容显示验证（首次使用动画指引） --一期不做"
    repeat: 1
    flow:
      - ai: "1. 查看右侧引导面板的文案"
      - aiAssert: "验证操作完成"

  - name: "首次进入丢定位时任务列表显示空状态文案"
    repeat: 1
    flow:
      - ai: "查看右侧作业任务面板"
      - aiAssert: "验证操作完成"

  - name: "丢定位后恢复定位时作业任务列表定位丢失提示消失"
    repeat: 1
    flow:
      - ai: "定位恢复后，查看任务列表展示"
      - aiAssert: "验证操作完成"

  - name: "定位丢失，无任务，任务列表显示为空"
    repeat: 1
    flow:
      - ai: "1.当前地图未添加任务保存，查看首页作业任务列表2"
      - ai: "1.当前地图有任务，定位异常时切换到其他无任务地图，查看首页作业任务列表"
      - aiAssert: "验证操作完成"

  - name: "定位丢失，有任务，列表显示定位丢失前任务"
    repeat: 1
    flow:
      - ai: "1.当前地图已添加任务保存，查看首页作业任务列表2"
      - ai: "1.当前地图无任务，定位异常时切换到其他有任务地图，查看首页作业任务列表"
      - aiAssert: "验证操作完成"

  - name: "定位丢失，作业任务列表任务可选中不可编辑"
    repeat: 1
    flow:
      - ai: "1.查看首页地图任务列表显示"
      - aiAssert: "验证操作完成"

  - name: "手动切换地图后，首页作业任务列表同步刷新"
    repeat: 1
    flow:
      - ai: "1.当前地图添加保存多个任务或执行过任务2.进入地图管理页面切换其他地图|3.查看任务列表显示"
      - aiAssert: "验证操作完成"

