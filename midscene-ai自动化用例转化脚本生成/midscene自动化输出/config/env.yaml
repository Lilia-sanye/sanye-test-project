# =============================================================================
# Midscene 实机/台架环境变量（单文件维护，按类型分节）
# 修改后执行：python tools/apply_device_env.py --all
# scripts 中保留 {{节.键}} 占位符；midscene run 前必须先 apply
# =============================================================================

# --- 设备连接 ---
device:
  id: "<设备ID>"
  adbPath: "D:/soft/android-sdk/platform-tools/adb.exe"

# --- 地图与定位 ---
map:
  name: "绿城·中央公园"
  nameAlt: "绿城-中央公园"

# --- 作业区标注（无任务/快速任务常用短名）---
zones:
  a:
    label: "A区草坪"
    mapLabel: "A区草坪 2000m²"
  b:
    label: "B区草坪"
    mapLabel: "B区草坪 1500m²"
  c:
    label: "C区草坪"
    mapLabel: "C区草坪 4000m²"
  detail:
    a: "A区-前草坪"
    b: "B区-东侧花园"
    c: "C区-草坪"
    d: "D区-草坪"

# --- 任务集与子区（有任务主界面）---
tasks:
  defaultSet: "日常割草"
  secondarySet: "深度清理"
  thirdSet: "快速修剪"
  save:
    newTask: "自动化测试任务"
    editTask: "编辑自动化测试"
    quickTask: "快速任务自动化测试"
    quickSmoke: "快速冒烟任务"
    uiSmoke: "界面设置冒烟测试"
    deletePending: "待删除测试任务"

# --- 主界面文案 ---
home:
  emptyPanelTitle: "暂无作业任务"
  guideTitle: "点击地图区域"
  guideSubtitle: "可快速创建任务、快速启动任务"

# --- 固定 UI（跨套件，一般不改）---
ui:
  panel:
    jobTasks: "作业任务"
  buttons:
    newFab: "+ 新建"
    newTask: "+ 新建任务"
    startWork: "开始作业"
    saveAsTask: "保存为任务"
    saveTask: "保存任务"
  toasts:
    taskSaved: "任务已保存"
    taskDeleted: "任务已删除"
